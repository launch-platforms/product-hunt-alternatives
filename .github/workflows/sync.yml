# Rebuilds README.md monthly: DR is refreshed from Ahrefs and the table re-sorted by the source site.
name: sync
on:
  schedule:
    - cron: "17 6 1 * *" # 1st of every month
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: curl -fsS https://discoverlaunches.com/api/lists/product-hunt-alternatives -o README.md
      - run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Monthly refresh: DR and last verified date"
          git push
